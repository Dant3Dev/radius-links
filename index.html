<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Radius</title>
  <script>
    // Restore path from 404 redirect, then deep-link or fall back to App Store
    (function () {
      var params = new URLSearchParams(window.location.search);
      var encodedPath = params.get('p');
      if (encodedPath) {
        // Clean up URL (cosmetic)
        var cleanUrl = window.location.origin + encodedPath;
        window.history.replaceState(null, '', cleanUrl);
      }

      var path = encodedPath ? decodeURIComponent(encodedPath) : window.location.pathname;
      // Try to open the app via universal link (iOS handles this automatically when app is installed)
      // If the app is not installed, redirect to the App Store
      var APP_STORE_URL = 'https://apps.apple.com/app/idYOUR_APP_STORE_ID';
      setTimeout(function () {
        window.location.href = APP_STORE_URL;
      }, 2000);
    })();
  </script>
</head>
<body>
  <p style="font-family:sans-serif;text-align:center;margin-top:40px;">
    Opening Radius&hellip;<br><br>
    <a href="https://apps.apple.com/app/idYOUR_APP_STORE_ID">Download on the App Store</a>
  </p>
</body>
</html>
